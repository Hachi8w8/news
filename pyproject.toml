[project]
name = "news"
version = "0.1.0"
description = "ZennとQiitaのRSS記事をAIで分類・要約し、Discordに通知するBot"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "litellm>=1.81.14",
    "python-dateutil",
    "python-dotenv",
    "requests>=2.32.5",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
