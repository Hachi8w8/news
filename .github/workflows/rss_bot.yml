name: RSS Bot

on:
  schedule:
    # 毎朝 06:00 JST = UTC 21:00（前日）
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache/processed_urls.json
          key: processed-articles-${{ github.run_id }}
          restore-keys: |
            processed-articles-

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK_DEV_AI: ${{ secrets.DISCORD_WEBHOOK_DEV_AI }}
          DISCORD_WEBHOOK_AI_NEWS: ${{ secrets.DISCORD_WEBHOOK_AI_NEWS }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          DISCORD_WEBHOOK_BOT_LOG: ${{ secrets.DISCORD_WEBHOOK_BOT_LOG }}
        run: uv run python src/main.py

      - name: Notify failure to bot-log
        if: failure()
        env:
          DISCORD_WEBHOOK_BOT_LOG: ${{ secrets.DISCORD_WEBHOOK_BOT_LOG }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"RSS Bot 実行失敗","description":"GitHub Actions ワークフローが失敗しました。\n[ログを確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","color":16711680}]}' \
            "$DISCORD_WEBHOOK_BOT_LOG"
